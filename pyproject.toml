[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "umat-oti"
version = "1.1.0"
description = "Deterministic order-truncated imaginary (OTI) derivative generation for Abaqus UMAT Fortran source (material tangent, internal Jacobians, higher-order, and parameter sensitivities)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
keywords = [
	"abaqus",
	"umat",
	"automatic-differentiation",
	"order-truncated-imaginary",
	"consistent-tangent",
	"finite-element",
	"fortran",
	"constitutive-models",
]
authors = [
	{ name = "Santiago García Botero" },
	{ name = "Harry Millwater" },
	{ name = "Arturo Montoya" },
	{ name = "David Restrepo" },
]
maintainers = [
	{ name = "Santiago García Botero" },
]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Science/Research",
	"License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Topic :: Scientific/Engineering",
	"Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
	"numpy>=1.26",
	"pandas>=2.0",
	"streamlit>=1.30",
	"sympy>=1.12",
]

[project.optional-dependencies]
test = ["pytest>=7"]
# Everything the publication artefacts need and the library itself does not.
# Kept optional so a user who only wants to transform a UMAT does not install a
# plotting stack, and so a reproduction that lacks them reports which artefact
# it could not build rather than failing outright.
paper = [
	"matplotlib>=3.8",
	"python-docx>=1.1",
	"pillow>=10",
]
# Browser automation for the two GUI screenshots. Separate because it also
# needs a downloaded browser, which pip alone does not provide.
screenshots = [
	"playwright>=1.40",
	"pillow>=10",
]

[project.urls]
Homepage = "https://github.com/AMMS-Lab-UTSA/UMAT_source_transformation"
Repository = "https://github.com/AMMS-Lab-UTSA/UMAT_source_transformation"
Issues = "https://github.com/AMMS-Lab-UTSA/UMAT_source_transformation/issues"

[project.scripts]
umat-oti = "umat_oti.cli:main"
umat-oti-config = "umat_oti.cli_json:main"
umat-oti-batch = "umat_oti.cli_batch:main"
umat-oti-pipeline = "umat_oti.pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The OTI support sources are read at run time by module generation. Without
# this they are omitted from a wheel and a pip-installed package raises
# "OTILIB module generation unavailable" on first use.
# Keyed on a real package: support/ and its templates hold no __init__.py, so
# packages.find never sees them and a key naming them directly would not match.
"umat_oti.oti" = [
	"support/*.f90",
	"support/*.py",
	"support/pyoti_templates/*.f90",
	"support/pyoti_templates/LICENSE",
	"support/pyoti_templates/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
	"unit: pure-Python logic; no compiler, no network, milliseconds",
	"integration: several components together, still offline and redistributable",
	"regression: pins a behaviour that was once wrong; the docstring says which",
	"slow: exercises a real transform/compile; minutes rather than milliseconds",
	"network: reaches the public internet; excluded from the offline suite",
	"fortran: needs a Fortran compiler on PATH",
	"abaqus: needs a licensed Abaqus installation; cannot run in public CI",
	"arc: needs the documented HPC environment and its scheduler",
	"publication: regenerates or checks a published table or figure",
]
